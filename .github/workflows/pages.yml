# FMSS – GitHub Pages (etapp 10). Build-sammu pole: tools/site.sh kopeerib failid.
#   /      avaleht ja lühijuhend (site/index.html, main)
#   /v1/   versioon 1 – kood tag'ist v1.5 (1.1 – kerimine ja suum, 1.2 – teede ümardusviga, 1.3 – kokkuvõte mahub EGA-sse, 1.4 – simulatsiooni lõpurežiim; etapp 11; 1.5 – kokkuvõte paljude konnektoritega mudelis, etapp 12), näidismudelid main-ist
# Pages'i seadetes: Source = GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sait kokku
        run: tools/site.sh _site v1.5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
